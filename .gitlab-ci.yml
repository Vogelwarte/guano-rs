stages:
  - check
  - test
  - build
  - deploy

# Use the official Rust image
image: rust:latest

# Cache cargo dependencies for faster builds
variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/
    - target/

# Run before each job
before_script:
  - rustc --version
  - cargo --version

# Format check
fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check
  allow_failure: false

# Clippy linting
clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings
  allow_failure: false

# Cargo check
check:
  stage: check
  script:
    - cargo check --all-features
  allow_failure: false

# Run tests
test:
  stage: test
  script:
    - cargo test --verbose
  needs: ["check"]

# Run wasm tests
test:wasm:
  stage: test
  before_script:
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-pack
    - apt-get update && apt-get install -y nodejs
  script:
    - wasm-pack test --release --node
  needs: ["check"]

# Build release
build:release:
  stage: build
  script:
    - cargo build --release --verbose
  artifacts:
    paths:
      - target/release/
    expire_in: 1 week
  needs: ["test"]
  only:
    - main
    - tags

# Build documentation
build:docs:
  stage: build
  script:
    - cargo doc --no-deps
  artifacts:
    paths:
      - target/doc/
    expire_in: 1 week
  needs: ["test"]

# Build wasm release
build:wasm:release:
  stage: build
  before_script:
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-pack
  script:
    - cd guano-wasm
    - sed -i "s/version = \"\([^+]*\)+[^\"]*\"/version = \"\1+${CI_COMMIT_SHORT_SHA}\"/" Cargo.toml
    - wasm-pack build --release
  artifacts:
    when: on_success
    access: all
    expire_in: "30 days"
    paths:
      - guano-wasm/pkg

# Publish to package registry
publish-npm:
  needs: ["test", "test:wasm", "build:wasm:release"]
  image: node:latest
  stage: deploy
  script:
    - cd guano-wasm/pkg
    - echo "@scope:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
