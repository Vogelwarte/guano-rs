[package]
name = "guano-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust library for reading GUANO metadata from WAV files"
readme = "README.md"
authors = ["Mario Fischer <mario.fischer@vogelwarte.ch>"]

[dependencies]
thiserror = "2.0.17"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
