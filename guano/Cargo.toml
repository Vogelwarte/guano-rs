[package]
name = "guano"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Vogelwarte/guano-rs"
description = "A Rust library for reading GUANO metadata from WAV files"
readme = "README.md"
authors = ["Mario Fischer <mario.fischer@vogelwarte.ch>"]
keywords = ["guano", "wav", "bioacoustics", "bat", "metadata"]
categories = ["multimedia::audio", "parser-implementations", "science"]

[features]
default = ["cli"]
# The `guano` binary. Off by default for library consumers, who would otherwise
# compile the whole clap tree for a binary they never build.
cli = ["serde", "dep:clap", "dep:serde_json"]
# serde `Serialize`/`Deserialize` for `GuanoFile` and `GuanoValue`.
serde = ["dep:serde"]

[dependencies]
thiserror = "2.0"
# No "derive" feature: the serde impls are hand written, see the Serde section of AGENTS.md.
serde = { version = "1.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
# The serde tests and doc examples use JSON even when the `cli` feature is off.
serde_json = "1.0"

[[bin]]
name = "guano"
path = "src/main.rs"
required-features = ["cli"]
